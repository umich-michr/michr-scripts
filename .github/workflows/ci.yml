# Continuous integration for the michr-scripts workspace.
#
# The workflow delegates to the root Makefile so local and CI behavior remain
# aligned. Each Python member owns its pytest and coverage configuration.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Install all Python workspace members
        run: uv sync --locked --all-packages

      - name: Verify formatting
        run: make format-check

      - name: Run Ruff with GitHub annotations
        if: always()
        shell: bash
        run: |
          mapfile -t python_files < <(
            find python/packages python/programs tools \
              -type f \
              <math><mrow><mo>−</mo></mrow><mrow><mi>n</mi><mi>a</mi><mi>m</mi><msup><mi>e</mi><mo lspace="0em" rspace="0em" class="tml-prime">′</mo></msup><mo>∗</mo></mrow><mrow><mi>.</mi><mi>p</mi><msup><mi>y</mi><mo lspace="0em" rspace="0em" class="tml-prime">′</mo></msup><mo>−</mo></mrow><mrow><mi>o</mi><mo>−</mo></mrow><mrow><mi>n</mi><mi>a</mi><mi>m</mi><msup><mi>e</mi><mo lspace="0em" rspace="0em" class="tml-prime">′</mo></msup><mo>∗</mo></mrow><mrow><mi>.</mi><mi>p</mi><mi>y</mi><msup><mi>i</mi><mo lspace="0em" rspace="0em" class="tml-prime">′</mo></msup></mrow></math> \
              -print 2>/dev/null
          )

          if [ "${#python_files[@]}" -eq 0 ]; then
            echo "No Python files found."
            exit 0
          fi

          uv run ruff check \
            --config pyproject.toml \
            --output-format=github \
            "${python_files[@]}"

      - name: Run strict type checking
        if: always()
        run: make typecheck

      - name: Check documentation synchronization
        if: always()
        run: make docs-check

      - name: Audit locked dependencies
        if: always()
        run: make audit-deps

      - name: Scan Python source for security issues
        if: always()
        run: make audit-code

      - name: Write quality summary
        if: always()
        run: |
          {
            echo "## Workspace quality"
            echo
            echo "- Formatting: see **Verify formatting**"
            echo "- Linting: see **Run Ruff with GitHub annotations**"
            echo "- Types: see **Run strict type checking**"
            echo "- Documentation: see **Check documentation synchronization**"
            echo "- Dependencies: see **Audit locked dependencies**"
            echo "- Source security: see **Scan Python source for security issues**"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Install all Python workspace members
        run: uv sync --locked --all-packages

      # Fixed ordering makes CI failures reproducible. Local default test runs
      # remain randomized.
      - name: Run all member coverage gates
        run: make coverage PYTEST_ARGS="-p no:randomly"

      - name: Write test and coverage summary
        if: always()
        run: |
          uv run python - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report_paths = sorted(
              [
                  *Path("python/packages").glob("*/reports"),
                  *Path("python/programs").glob("*/reports"),
              ]
          )

          print("## Workspace tests and coverage\n")

          if not report_paths:
              print("No member reports were produced.")
              raise SystemExit(0)

          print(
              "| Member | Tests | Passed | Failed | Errors | Skipped "
              "| Lines | Branches |"
          )
          print("|---|---:|---:|---:|---:|---:|---:|---:|")

          for report_directory in report_paths:
              member = report_directory.parent.name
              junit_path = report_directory / "junit.xml"
              coverage_path = report_directory / "coverage.xml"

              tests = 0
              failures = 0
              errors = 0
              skipped = 0
              line_rate = 0.0
              branch_rate = 0.0

              if junit_path.is_file():
                  junit_root = ET.parse(junit_path).getroot()
                  suites = (
                      list(junit_root.findall("testsuite"))
                      if junit_root.tag == "testsuites"
                      else [junit_root]
                  )

                  tests = sum(
                      int(suite.get("tests", 0))
                      for suite in suites
                  )
                  failures = sum(
                      int(suite.get("failures", 0))
                      for suite in suites
                  )
                  errors = sum(
                      int(suite.get("errors", 0))
                      for suite in suites
                  )
                  skipped = sum(
                      int(suite.get("skipped", 0))
                      for suite in suites
                  )

              passed = tests - failures - errors - skipped

              if coverage_path.is_file():
                  coverage_root = ET.parse(coverage_path).getroot()
                  line_rate = (
                      float(coverage_root.get("line-rate", 0.0)) * 100
                  )
                  branch_rate = (
                      float(coverage_root.get("branch-rate", 0.0)) * 100
                  )

              print(
                  f"| `{member}` | {tests} | {passed} | {failures} | "
                  f"{errors} | {skipped} | {line_rate:.2f}% | "
                  f"{branch_rate:.2f}% |"
              )
          PYTHON

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: always()

    steps:
      - name: Verify required jobs succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "::error::Quality job ended with: $QUALITY_RESULT"
            exit 1
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::Test job ended with: $TEST_RESULT"
            exit 1
          fi

          echo "All CI jobs succeeded."
