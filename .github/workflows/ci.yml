# ===========================================================================
# Continuous integration for the michr-scripts uv workspace
#
# The workflow delegates to the root Makefile so local development and CI use
# the same commands. Each workspace member owns its pytest and coverage
# configuration.
#
# GitHub reports failures through:
#   - failed status checks;
#   - inline annotations from Ruff, mypy, and pytest;
#   - command output and workflow summaries;
#   - standard GitHub Actions notifications.
# ===========================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_COLOR: "1"

jobs:
  # -------------------------------------------------------------------------
  # Workspace-wide static checks and security audits
  # -------------------------------------------------------------------------
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned Python version
        run: uv python install

      - name: Install all workspace members
        run: uv sync --locked --all-packages

      - name: Verify formatting
        run: make format-check

      - name: Run Ruff
        if: always()
        run: |
          uv run ruff check \
            --output-format=github \
            python/packages/*/src \
            python/packages/*/tests \
            python/programs/*/src \
            python/programs/*/tests \
            scripts 2>/dev/null || \
          uv run ruff check \
            --output-format=github \
            python/packages/*/src \
            python/packages/*/tests \
            scripts

      - name: Run strict type checking
        if: always()
        run: make typecheck

      - name: Check documentation synchronization
        if: always()
        run: make docs-check

      - name: Audit locked dependencies
        if: always()
        run: make audit-deps

      - name: Scan source code for security issues
        if: always()
        run: make audit-code

      - name: Quality summary
        if: always()
        run: |
          {
            echo "## Workspace quality"
            echo
            echo "- Formatting: see **Verify formatting**"
            echo "- Linting: see **Run Ruff**"
            echo "- Types: see **Run strict type checking**"
            echo "- Documentation: see **Check documentation synchronization**"
            echo "- Dependencies: see **Audit locked dependencies**"
            echo "- Source security: see **Scan source code for security issues**"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Per-member tests and coverage
  # -------------------------------------------------------------------------
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned Python version
        run: uv python install

      - name: Install all workspace members
        run: uv sync --locked --all-packages

      # pytest-github-actions-annotate-failures is installed by the root
      # development dependency group and creates annotations for failures.
      #
      # Test ordering is fixed in CI so a failure can be reproduced locally
      # with the same command. Local default runs remain randomized.
      - name: Run all member coverage gates
        run: make coverage PYTEST_ARGS="-p no:randomly"

      - name: Write test and coverage summary
        if: always()
        run: |
          uv run python - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report_paths = sorted(
              [
                  *Path("packages").glob("*/reports"),
                  *Path("programs").glob("*/reports"),
              ]
          )

          print("## Workspace tests and coverage\n")

          if not report_paths:
              print("No member reports were produced.")
              raise SystemExit(0)

          print("| Member | Tests | Passed | Failed | Errors | Skipped | Lines | Branches |")
          print("|---|---:|---:|---:|---:|---:|---:|---:|")

          for report_directory in report_paths:
              member = report_directory.parent.name

              junit_path = report_directory / "junit.xml"
              coverage_path = report_directory / "coverage.xml"

              tests = passed = failures = errors = skipped = 0
              line_rate = branch_rate = 0.0

              if junit_path.is_file():
                  root = ET.parse(junit_path).getroot()
                  suites = (
                      list(root.findall("testsuite"))
                      if root.tag == "testsuites"
                      else [root]
                  )

                  tests = sum(int(suite.get("tests", 0)) for suite in suites)
                  failures = sum(
                      int(suite.get("failures", 0)) for suite in suites
                  )
                  errors = sum(int(suite.get("errors", 0)) for suite in suites)
                  skipped = sum(
                      int(suite.get("skipped", 0)) for suite in suites
                  )
                  passed = tests - failures - errors - skipped

              if coverage_path.is_file():
                  root = ET.parse(coverage_path).getroot()
                  line_rate = float(root.get("line-rate", 0.0)) * 100
                  branch_rate = float(root.get("branch-rate", 0.0)) * 100

              print(
                  f"| `{member}` | {tests} | {passed} | {failures} | "
                  f"{errors} | {skipped} | {line_rate:.2f}% | "
                  f"{branch_rate:.2f}% |"
              )
          PYTHON

  # -------------------------------------------------------------------------
  # One stable status check for branch protection
  # -------------------------------------------------------------------------
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: always()

    steps:
      - name: Verify required jobs succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "::error::Quality job ended with: $QUALITY_RESULT"
            exit 1
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::Test job ended with: $TEST_RESULT"
            exit 1
          fi

          echo "All CI jobs succeeded."
