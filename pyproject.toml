# ===========================================================================
# michr-scripts — uv workspace root
#
# This project is not itself installable. It declares the workspace, holds the
# shared development dependency group, and configures the tools that apply
# uniformly across every package and program.
#
# pytest and coverage are configured per package, because each package runs its
# own suite from its own directory.
#
#   uv sync --all-packages     install every workspace member
#   make check                 run the gate across all members
# ===========================================================================
[project]
name = "michr-scripts"
version = "0.0.0"
description = "MICHR scripts: shared packages and runnable programs."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "University of Michigan" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "pytest-github-actions-annotate-failures>=0.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

# ===========================================================================
# Workspace
# ===========================================================================
[tool.uv]
# The root is a coordination point, not a distributable.
package = false

[tool.uv.workspace]
members = ["python/packages/*", "python/programs/*"]

# ===========================================================================
# Ruff: shared across every member
# ===========================================================================
[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "ANN",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "EM",
    "ISC",
    "LOG",
    "G",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "PERF",
    "FURB",
    "RUF",
]
ignore = ["D203", "D213", "ISC001", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
    "program_configuration",
    "study_posting_ai_analysis",
    "study_posting_audit_exploration",
    "study_posting_audit_report",
    "tabular_row_sources",
    "text_post_edit_metrics",
    "text_readability_metrics",
]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR2004",
    "S311",
]
"**/src/*/__init__.py" = ["F401"]

# ===========================================================================
# mypy: shared across every member
# ===========================================================================
[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
warn_no_return = true
explicit_package_bases = true
namespace_packages = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]

# sacrebleu is typed but declares no explicit re-exports, so strict mode's
# no_implicit_reexport rejects "from sacrebleu.metrics import TER".
[[tool.mypy.overrides]]
module = ["sacrebleu.*"]
implicit_reexport = true

# textstat does not publish a py.typed marker or separate type stubs.
[[tool.mypy.overrides]]
module = ["textstat", "textstat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
# ===========================================================================
# Bandit: shared
# ===========================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]
