# ===========================================================================
# Project metadata (PEP 621)
# ===========================================================================
[project]
name = "study-posting-ai-analysis"
version = "0.1.0"
description = "Post-editing metrics for AI-assisted form field suggestions."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "University of Michigan" }]
keywords = ["ter", "hter", "post-editing", "edit-distance", "llm-evaluation"]

# --- Runtime dependencies --------------------------------------------------
# Lower bounds are the versions the analysis was verified against. Upper
# bounds exclude the next major version, because a major release of a metric
# library could silently change reported scores.
dependencies = ["sacrebleu>=2.6.0,<3.0", "rapidfuzz>=3.14.6,<4.0"]

[project.urls]
Repository = "https://github.com/your-org/study-posting-ai-analysis"

# ===========================================================================
# Development dependency group (PEP 735)
# ===========================================================================
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "pytest-github-actions-annotate-failures>=0.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]


# ===========================================================================
# Build backend
# ===========================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_posting_ai_analysis"]

# ===========================================================================
# uv
# ===========================================================================
[tool.uv]
package = true

[tool.uv.sources]
study-posting-ai-analysis = { workspace = true }

# ===========================================================================
# Ruff: formatter and linter
# ===========================================================================
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "ANN",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "EM",
    "ISC",
    "LOG",
    "G",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "PERF",
    "FURB",
    "RUF",
]
ignore = ["D203", "D213", "ISC001", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["study_posting_ai_analysis"]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR2004",
    "ANN201",
    "S311",
]
"src/study_posting_ai_analysis/__init__.py" = ["F401"]

# ===========================================================================
# mypy
# ===========================================================================
[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
# Required for src-layout: tells mypy that "src" is a package root, so
# src/study_posting_ai_analysis/models.py maps to
# study_posting_ai_analysis.models rather than being guessed from the path.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
warn_no_return = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
module = ["sacrebleu.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ===========================================================================
# pytest
# ===========================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--durations=10",
]
markers = ["slow: randomized differential tests; excluded by 'make test-fast'"]
filterwarnings = ["error"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s: %(message)s"

# ===========================================================================
# Coverage
# ===========================================================================
[tool.coverage.run]
source = ["src/study_posting_ai_analysis"]
branch = true
parallel = false
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.xml]
output = "reports/coverage.xml"

# ===========================================================================
# Bandit
# ===========================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]
