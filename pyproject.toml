# ===========================================================================
# Project metadata (PEP 621)
# ===========================================================================
[project]
name = "study-posting-ai-analysis"
version = "0.1.0"
description = "Metrics for AI-assisted study posting authoring audit records."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "University of Michigan" }]
keywords = ["ter", "hter", "post-editing", "audit", "oracle", "llm-evaluation"]

# --- Runtime dependencies --------------------------------------------------
# Lower bounds are the versions the analysis was verified against. Upper
# bounds exclude the next major version, because a major release of a metric
# library could silently change reported scores.
dependencies = [
    "sacrebleu>=2.6.0,<3.0",
    "rapidfuzz>=3.14.6,<4.0",
    "pandas>=2.2.3,<3.0",
]

# --- Optional feature sets -------------------------------------------------
# Installed with: uv sync --extra oracle
# Kept optional so the test suite and CI never require a database driver.
[project.optional-dependencies]
oracle = ["oracledb>=3.0,<4.0"]

# --- Command-line entry point ----------------------------------------------
# Creates the "study-posting-analysis" command inside the virtual environment.
[project.scripts]
study-posting-analysis = "study_posting_ai_analysis.cli:main"

[project.urls]
Repository = "https://github.com/your-org/study-posting-ai-analysis"

# ===========================================================================
# Development dependency group (PEP 735)
# ===========================================================================
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "ruff>=0.9",
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
]


# ===========================================================================
# Build backend
# ===========================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_posting_ai_analysis"]

# ===========================================================================
# uv
# ===========================================================================
[tool.uv]
package = true

# ===========================================================================
# Ruff: formatter and linter
# ===========================================================================
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "ANN",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "EM",
    "ISC",
    "LOG",
    "G",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "PD",
    "PERF",
    "FURB",
    "RUF",
]
ignore = [
    "D203",
    "D213",
    "ISC001",
    "TRY003",
    "EM101",
    "EM102",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["study_posting_ai_analysis"]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR2004",
    "ANN201",
    "S311",
]
"src/study_posting_ai_analysis/__init__.py" = ["F401"]

# ===========================================================================
# mypy
# ===========================================================================
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
warn_no_return = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
module = ["sacrebleu.*", "oracledb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ===========================================================================
# pytest
# ===========================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--durations=10",
]
markers = [
    "slow: randomized differential tests; excluded by 'make test-fast'",
    "oracle: requires a live Oracle connection; skipped unless configured",
    "integration: exercises more than one layer together",
]
filterwarnings = ["error"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s: %(message)s"

# ===========================================================================
# Coverage
# ===========================================================================
[tool.coverage.run]
source = ["src/study_posting_ai_analysis"]
branch = true
parallel = false
relative_files = true
omit = ["*/__main__.py", "*/adapters/oracle_adapter.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.xml]
output = "reports/coverage.xml"

# ===========================================================================
# Bandit
# ===========================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]
