# ===========================================================================
# Pre-commit hooks
#
# Install once per clone:
#     make hooks
#
# Run manually against the whole repository:
#     make hooks-run
#
# Bypass in an emergency (discouraged):
#     git commit --no-verify
#
# Keep hook versions current:
#     uv run pre-commit autoupdate
#
# Design notes
#   - Hooks operate on staged files, so commits stay fast.
#   - Formatting and import ordering are applied automatically.
#   - mypy runs through "uv run" so it sees the project virtual environment
#     and the real installed dependencies rather than an isolated hook env.
#   - The full test suite is NOT a commit hook. Run "make check" before
#     opening a pull request.
# ===========================================================================

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  # -----------------------------------------------------------------------
  # General file hygiene
  # -----------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-toml
      - id: check-yaml
      - id: check-json
        # VS Code configuration files legitimately contain comments (JSONC),
        # which strict JSON parsing rejects.
        exclude: ^\.vscode/
      - id: check-ast
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        # Test helpers are not test modules.
        exclude: ^python/packages/.*/tests/helpers/
      # Blocks committing a file named exactly "id_rsa", "*.pem", etc.
      - id: detect-private-key

  # -----------------------------------------------------------------------
  # Ruff: lint, then format
  # -----------------------------------------------------------------------
  # Order matters. Linting with --fix can rewrite code, so formatting runs
  # afterwards to normalize the result.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # -----------------------------------------------------------------------
  # uv: keep the lockfile consistent with pyproject.toml
  # -----------------------------------------------------------------------
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      # Fails if pyproject.toml changed without a matching uv.lock update.
      - id: uv-lock

  # -----------------------------------------------------------------------
  # Local hooks that must use the project virtual environment
  # -----------------------------------------------------------------------
  - repo: local
    hooks:
      # mypy needs the real installed packages and type stubs to be useful,
      # so it runs via "uv run" rather than in an isolated hook environment.
      - id: mypy
        name: mypy (strict)
        entry: bash -c 'root=$(pwd); for m in python/packages/*; do (cd "$m" && MYPYPATH=src uv run mypy --config-file "$root/pyproject.toml" src tests) || exit 1; done; uv run mypy --config-file "$root/pyproject.toml" scripts'
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      # Bandit examines only our own source tree.
      - id: bandit
        name: bandit (security)
        entry: bash -c 'uv run bandit --configfile pyproject.toml --recursive python/packages/*/src --quiet'
        language: system
        types: [python]
        files: ^python/packages/.*/src/
        pass_filenames: false

      # Requires a specification update when a metric or rule module changes.
      # See scripts/check_docs_sync.py for the pairings.
      - id: docs-sync
        name: documentation sync check
        entry: uv run python scripts/check_docs_sync.py
        language: system
        pass_filenames: false
        always_run: true

  # -----------------------------------------------------------------------
  # Commit message format
  # -----------------------------------------------------------------------
  # Conventional Commits give a readable history and make it obvious what an
  # AI agent changed in each commit. Example:
  #     feat(metrics): add soft-word robustness score
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - test
          - refactor
          - perf
          - build
          - ci
          - chore
          - revert
