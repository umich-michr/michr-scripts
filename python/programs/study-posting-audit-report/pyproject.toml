# ===========================================================================
# study-posting-audit-report
#
# Runnable program that reads audit rows, applies study-posting analysis, and
# writes normalized record and field-metric CSV files.
#
# Shared Ruff, mypy, and Bandit configuration lives at the workspace root.
# This file owns program metadata, dependencies, pytest, and coverage.
# ===========================================================================

[project]
name = "study-posting-audit-report"
version = "0.1.0"
description = "Generate normalized audit, AI-assistance, and readability reports."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "University of Michigan" }]
keywords = ["study-posting", "audit-report", "llm-evaluation", "csv-report"]

dependencies = [
    "oracledb>=26.0.0",
    "program-configuration>=0.1.0",
    "study-posting-ai-analysis>=0.1.0",
    "tabular-row-sources>=0.1.0",
    "text-readability-metrics>=0.1.0",
]

[tool.uv.sources]
program-configuration = { workspace = true }
study-posting-ai-analysis = { workspace = true }
tabular-row-sources = { workspace = true }
text-readability-metrics = { workspace = true }

[project.scripts]
study-posting-audit-report = "study_posting_audit_report.cli:main"

# ===========================================================================
# Build
# ===========================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_posting_audit_report"]

# ===========================================================================
# pytest
# ===========================================================================

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--durations=10",
]
filterwarnings = ["error"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s: %(message)s"

# ===========================================================================
# Coverage
# ===========================================================================

[tool.coverage.run]
source = ["study_posting_audit_report"]
branch = true
parallel = false
relative_files = true

[tool.coverage.paths]
source = [
    "src/study_posting_audit_report",
    "*/site-packages/study_posting_audit_report",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.xml]
output = "reports/coverage.xml"
