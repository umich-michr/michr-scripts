# ===========================================================================
# study-posting-audit-exploration
#
# Runnable program that validates and explores normalized audit-report CSVs.
#
# This program consumes records.csv, ai_assistance_metrics.csv, and
# readability_metrics.csv. It owns derived analytical datasets, descriptive
# summaries, visual reporting, and exploratory interpretation.
#
# Shared Ruff, mypy, and Bandit configuration lives at the workspace root.
# ===========================================================================

[project]
name = "study-posting-audit-exploration"
version = "0.1.0"
description = "Explore normalized study-posting audit reports."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "University of Michigan" }]
keywords = [
    "study-posting",
    "audit-analysis",
    "exploratory-analysis",
    "readability",
    "pandas",
]

dependencies = ["pandas>=2.3,<4.0", "pandas-stubs>=2.3,<4.0"]

[project.scripts]
study-posting-audit-exploration = "study_posting_audit_exploration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_posting_audit_exploration"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--durations=10",
]
filterwarnings = ["error"]
log_cli = false

[tool.coverage.run]
source = ["study_posting_audit_exploration"]
branch = true
parallel = false
relative_files = true

[tool.coverage.paths]
source = [
    "src/study_posting_audit_exploration",
    "*/site-packages/study_posting_audit_exploration",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.xml]
output = "reports/coverage.xml"
