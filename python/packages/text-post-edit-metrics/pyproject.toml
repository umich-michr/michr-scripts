# ===========================================================================
# text-post-edit-metrics
#
# Pure directional technical post-editing metrics:
#   initial or generated text + represented edited text -> PostEditingResult
#
# Shared Ruff, mypy, and Bandit configuration lives at the workspace root.
# This file owns package metadata, runtime dependencies, pytest behavior, and
# package coverage.
# ===========================================================================

[project]
name = "text-post-edit-metrics"
version = "0.1.0"
description = "Directional technical post-editing metrics for initial and revised text."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "University of Michigan" }]
keywords = [
    "ter",
    "hter",
    "post-editing",
    "edit-distance",
    "text-revision",
    "llm-evaluation",
]

# Major versions are bounded because dependency upgrades could change reported
# metric values.
dependencies = ["sacrebleu>=2.6.0,<3.0", "rapidfuzz>=3.14.6,<4.0"]

# ===========================================================================
# Build
# ===========================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_post_edit_metrics"]

# ===========================================================================
# pytest
# ===========================================================================

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--durations=10",
]
markers = ["slow: randomized differential tests; excluded by 'make test-fast'"]
filterwarnings = ["error"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s: %(message)s"

# ===========================================================================
# Coverage
# ===========================================================================

[tool.coverage.run]
source = ["text_post_edit_metrics"]
branch = true
parallel = false
relative_files = true

# Map installed-package paths back to workspace source for stable local and CI
# reports.
[tool.coverage.paths]
source = [
    "src/text_post_edit_metrics",
    "*/site-packages/text_post_edit_metrics",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.xml]
output = "reports/coverage.xml"
