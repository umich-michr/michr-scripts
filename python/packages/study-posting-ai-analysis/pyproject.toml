# ===========================================================================
# study-posting-ai-analysis
#
# Pure study-posting business analysis:
#   suggested object + selected object + final object -> per-field results
#
# Technical text metrics are delegated to text-post-edit-metrics.
# This package performs no database, filesystem, reporting, logging, or CLI I/O.
#
# Shared Ruff, mypy, and Bandit configuration lives at the workspace root.
# This file owns package metadata, pytest behavior, and package coverage.
# ===========================================================================

[project]
name = "study-posting-ai-analysis"
version = "0.1.0"
description = "Study-posting policy analysis for AI suggestions, selections, and final values."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "University of Michigan" }]
keywords = [
    "study-posting",
    "llm-evaluation",
    "suggestion-analysis",
    "post-editing",
    "audit-analysis",
]

dependencies = ["text-post-edit-metrics>=0.1.0"]

# During workspace development, resolve the dependency from its sibling member
# rather than from a package index.
[tool.uv.sources]
text-post-edit-metrics = { workspace = true }

# ===========================================================================
# Build
# ===========================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_posting_ai_analysis"]

# ===========================================================================
# pytest
# ===========================================================================

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--durations=10",
]
filterwarnings = ["error"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s: %(message)s"

# ===========================================================================
# Coverage
# ===========================================================================

[tool.coverage.run]
source = ["study_posting_ai_analysis"]
branch = true
parallel = false
relative_files = true

# Map an installed-package path back to the workspace source tree so reports
# remain clickable and comparable across local and CI environments.
[tool.coverage.paths]
source = [
    "src/study_posting_ai_analysis",
    "*/site-packages/study_posting_ai_analysis",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.xml]
output = "reports/coverage.xml"
