# ===========================================================================
# program-configuration
#
# Reusable layered, typed, secret-aware configuration resolution.
#
# The package resolves values supplied by callers. Filesystem dotenv loading,
# command-line parsing, and terminal prompting are added through separate,
# explicit interfaces rather than hidden global behavior.
#
# Shared Ruff, mypy, and Bandit configuration lives at the workspace root.
# ===========================================================================

[project]
name = "program-configuration"
version = "0.1.0"
description = "Layered, typed, secret-aware configuration resolution for runnable programs."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "University of Michigan" }]
keywords = ["configuration", "environment", "dotenv", "cli", "programs"]

dependencies = [
    "python-dotenv>=1.2,<2.0",
]

# ===========================================================================
# Build
# ===========================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/program_configuration"]

# ===========================================================================
# pytest
# ===========================================================================

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--durations=10",
]
filterwarnings = ["error"]
log_cli = false

# ===========================================================================
# Coverage
# ===========================================================================

[tool.coverage.run]
source = ["program_configuration"]
branch = true
parallel = false
relative_files = true

[tool.coverage.paths]
source = ["src/program_configuration", "*/site-packages/program_configuration"]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.xml]
output = "reports/coverage.xml"
