# ===========================================================================
# tabular-row-sources
#
# Schema-aware, lazy sources of tabular rows.
#
# CSV and database sources use the same RowSchema to produce canonical Python
# values. The package contains no study-specific analysis, aggregation,
# reporting, logging, or CLI policy.
#
# Shared Ruff, mypy, and Bandit configuration lives at the workspace root.
# This file owns package metadata, pytest behavior, and package coverage.
# ===========================================================================

[project]
name = "tabular-row-sources"
version = "0.1.0"
description = "Schema-aware lazy sources of tabular rows."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "University of Michigan" }]
keywords = [
    "row-stream",
    "tabular-data",
    "schema",
    "csv",
    "db-api",
    "data-processing",
]

# The schema model, conversion layer, and CSV source use only the standard
# library. Database drivers will be optional dependencies owned by adapters.
dependencies = []

# ===========================================================================
# Build
# ===========================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_row_sources"]

# ===========================================================================
# pytest
# ===========================================================================

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--showlocals",
    "--tb=short",
    "--durations=10",
]
filterwarnings = ["error"]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s: %(message)s"

# ===========================================================================
# Coverage
# ===========================================================================

[tool.coverage.run]
source = ["tabular_row_sources"]
branch = true
parallel = false
relative_files = true

[tool.coverage.paths]
source = ["src/tabular_row_sources", "*/site-packages/tabular_row_sources"]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
]

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.xml]
output = "reports/coverage.xml"
